[project]
name = "psychea"
version = "0.2.0"
description = "USB camera and microphone for the PSP: plays a Sony Go!Cam for games like EyePet"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "libusb1>=3.3",                     # "is the PSP plugged in?" on every OS, all transfers on Linux
    "opencv-python-headless>=4.10",     # webcam capture, resize, JPEG encoding (bundles libjpeg-turbo)
    "sounddevice>=0.5",                 # PC microphone (bundles PortAudio on Windows)
    "cv2-enumerate-cameras>=1.1",       # --list: camera names for --webcam
]

[project.scripts]
psychea = "psychea.cli:main"

[dependency-groups]
dev = ["pytest>=9", "coverage>=7", "radon>=6", "mutmut>=3", "ruff>=0.8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psychea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90"]
ignore = ["E741", "B905"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["psychea"]
platform = "win32"                      # winusb.py and driver.py are Windows code; the rest is platform-neutral
                                        # (`mypy --platform linux` passes too, except for those two modules)
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["usb1", "sounddevice", "cv2", "cv2_enumerate_cameras"]
ignore_missing_imports = true
